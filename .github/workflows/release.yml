name: Release APK

# 打 tag（v*）或手动触发时，在 CI 上编译 release APK（正式签名）并发布到 GitHub Release。
# 签名 keystore 与密码存 GitHub secrets，CI 里解码落盘 + 生成 key.properties，跟本机同一套读取路径。
#
# 两条硬规则（v1.0.0/v1.0.1 的 Release 都败在这）：
#   1. 仓库里的 android/gradle.properties 绝不能写代理——CI runner 上没有本机 FlClash。
#   2. keystore 路径不要用环境变量传 "android/app/x.jks"：Gradle 的 file() 在 app 模块内解析，
#      会变成 android/app/android/app/x.jks。走 key.properties（storeFile 相对 app 模块）。
#
# 构建流程照 FlClash（chen08209/FlClash）的成熟做法：官方 gradle/actions/setup-gradle 管缓存，
# Gradle wrapper 用 Flutter SDK 自带的，不手写 wrapper/dists 硬编码路径。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      # Flutter 模板的 .gitignore 忽略 gradle-wrapper.jar，用 SDK 自带的补上，省一次下载。
      - name: 补 Gradle wrapper（用 Flutter SDK 自带的）
        run: |
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." android/
          chmod +x android/gradlew
          ls -l android/gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 拉依赖
        run: flutter pub get

      - name: 写入签名配置（与本机 key.properties 同一套）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::签名 secrets 缺失（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/controlhub-app.jks
          test -s android/app/controlhub-app.jks || { echo "::error::keystore 解码为空"; exit 1; }
          {
            echo "storeFile=controlhub-app.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/app/key.properties
          ls -l android/app/controlhub-app.jks android/app/key.properties

      - name: 构建 release APK（正式签名）
        run: flutter build apk --release

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
