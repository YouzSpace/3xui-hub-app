name: Release APK

# 打 tag（v*）或手动触发时，在 CI 上编译 release APK（正式签名）并发布到 GitHub Release。
# 签名 keystore 与密码存 GitHub secrets，CI 里解码落盘后用环境变量喂给 Gradle。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 预下载 Gradle 到 wrapper 缓存（避免 wrapper 下载 307/302 重定向失败）
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-9.3.1-all/9ot9r568e8zfvvd4mn8rbu1j0"
          mkdir -p "$DIST_DIR"
          curl -fL -o "$DIST_DIR/gradle-9.3.1-all.zip" "https://services.gradle.org/distributions/gradle-9.3.1-all.zip"
          unzip -q "$DIST_DIR/gradle-9.3.1-all.zip" -d "$DIST_DIR"
          touch "$DIST_DIR/gradle-9.3.1-all.zip.ok"

      - name: 解码签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/controlhub-app.jks

      - name: 提取版本号（tag 去 v 前缀）
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建 release APK（正式签名）
        env:
          KEYSTORE_PATH: android/app/controlhub-app.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
